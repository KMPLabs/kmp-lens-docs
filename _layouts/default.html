<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0F172A">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/assets/social-preview.png' | absolute_url }}">
    <meta property="og:image:alt" content="KMP Lens">
    <meta name="twitter:card" content="summary_large_image">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
    <link rel="icon" href="{{ '/assets/brand/favicon-32.png' | relative_url }}" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="{{ '/assets/brand/apple-touch-icon.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/style.css?v=rc-preview' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="shell masthead">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="KMP Lens home">
          <img class="brand-mark" src="{{ '/assets/brand/kmp-lens-logo.png' | relative_url }}" alt="">
          <span>KMP Lens</span>
        </a>
        <span class="release-badge">{{ site.product_version }} · {{ site.release_status }}</span>
      </div>
      <nav class="shell nav" aria-label="Primary navigation">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/getting-started/' | relative_url }}">Getting Started</a>
        <a href="{{ '/configuration/' | relative_url }}">Configuration</a>
        <a href="{{ '/troubleshooting/' | relative_url }}">Troubleshooting</a>
        <a href="{{ '/compatibility/' | relative_url }}">Compatibility</a>
      </nav>
    </header>
    <main id="main" class="shell content">
      {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
      {{ content }}
    </main>
    <footer class="site-footer">
      <div class="shell footer-grid">
        <div>
          <strong>KMP Lens</strong>
          <p>Built by KMPLabs.</p>
        </div>
      </div>
    </footer>
  </body>
</html>
